name: Homey verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: git diff --exit-code -- app.json lib/tonies-sdk.js
      - run: npm run test:memory
      - run: npm audit --omit=dev
