name: Prepare GitHub release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (auto follows Conventional Commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
permissions:
  contents: write
concurrency:
  group: tonies-homey-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release -- --bump "$BUMP"
        env:
          BUMP: ${{ inputs.bump }}
      - run: npm run verify
      - run: npm run test:memory
      - run: npm audit --omit=dev
      - name: Commit and tag verified release
        run: |
          version=$(node -p 'require("./package.json").version')
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json app.json CHANGELOG.md .homeychangelog.json
          git commit -m "chore(release): $version"
          git tag -a "v$version" -m "Tonies $version"
          git push --atomic origin HEAD:main "refs/tags/v$version"
      - name: Create GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          node -e 'const fs=require("node:fs"); const version=require("./package.json").version; fs.writeFileSync("/tmp/tonies-release-notes.txt", require("./.homeychangelog.json")[version].en)'
          gh release create "v$version" --title "Tonies $version" --notes-file /tmp/tonies-release-notes.txt
